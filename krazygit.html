<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KrazyGit</title>
<link rel="stylesheet" href="/vendor/highlight-light.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/vendor/highlight-dark.min.css" media="(prefers-color-scheme: dark)">
<script src="/vendor/highlight.min.js"></script>
<style>
:root {
  --bg: #FFFFFF; --side: #F3F4F6; --panel: #FFFFFF; --sunk: #F7F8FA; --ink: #1B1F24; --muted: #5F6B7A; --faint: #98A2B3;
  --rule: #E3E6EA; --hover: #EEF0F3; --sel: #E9EDFF;
  --accent: #2F4BDA; --accent-ink: #FFFFFF; --accent-soft: #EDF0FF; --accent-line: #CBD3FF;
  --add: #157F3D; --add-bg: #E5F5EB; --del: #B42318; --del-bg: #FDECEA;
  --warn: #8F5600; --warn-bg: #FFF5DD; --warn-line: #F0C35B; --danger: #C4320A; --danger-ink: #FFFFFF; --ok: #157F3D; --ok-bg: #E7F6EC;
  --pop-shadow: 0 12px 32px rgba(16, 24, 40, .16), 0 2px 6px rgba(16, 24, 40, .08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17191D; --side: #1D2026; --panel: #1F2228; --sunk: #15171B; --ink: #E8EAED; --muted: #A0A8B5; --faint: #6E7684;
    --rule: #2D323A; --hover: #262A32; --sel: #252D52;
    --accent: #8C9EFF; --accent-ink: #0D1226; --accent-soft: #212849; --accent-line: #3A4680;
    --add: #7FD3A0; --add-bg: #14301F; --del: #F29C9C; --del-bg: #3A1717;
    --warn: #F3C66E; --warn-bg: #33270C; --warn-line: #8C6A1E; --danger: #FF8A80; --danger-ink: #2B0A06; --ok: #7FD3A0; --ok-bg: #14301F;
    --pop-shadow: 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { margin: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr); background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased }
h1, h2, h3, h4 { margin: 0; line-height: 1.25 }
p { margin: 0 }
code, .mono { font-family: var(--mono); font-size: 12.5px }
.ic { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.faint { color: var(--faint) }
.hint { color: var(--muted); font-size: 13px }
.spacer { flex: 1 }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }

/* controls */
button, .btnlike { font: inherit; font-size: 13px; font-weight: 500; line-height: 1; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px;
  border-radius: 7px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; user-select: none }
button:hover, .btnlike:hover { background: var(--hover) }
button:disabled { opacity: .45; cursor: default; background: var(--panel) }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
button.primary:hover { filter: brightness(1.07); background: var(--accent) }
button.danger { color: var(--danger) }
button.danger-btn { background: var(--danger); border-color: var(--danger); color: var(--danger-ink) }
button.ghost { border-color: transparent; background: transparent }
button.ghost:hover { background: var(--hover) }
button.link { border: 0; background: none; color: var(--accent); padding: 0 2px; height: auto }
button.link:hover { text-decoration: underline; background: none }
button.icon, .btnlike.icon { width: 30px; padding: 0; justify-content: center }
button.big { height: 38px; padding: 0 18px; font-size: 14px; font-weight: 600; border-radius: 9px }
button.wide { width: 100%; justify-content: center }
button.chip { height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input, textarea, select { font: inherit; font-size: 13px; color: var(--ink); background: var(--sunk); border: 1px solid var(--rule); border-radius: 7px; padding: 6px 10px; min-width: 0; height: 30px }
textarea { width: 100%; resize: vertical; display: block; height: auto; line-height: 1.45 }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--panel) }
input[type=checkbox] { width: 15px; height: 15px; margin: 0; padding: 0; accent-color: var(--accent); flex: none; box-shadow: none }
.search { position: relative; display: flex; align-items: center }
.search .ic { position: absolute; left: 9px; color: var(--faint); pointer-events: none }
.search input { padding-left: 29px; width: 100% }
.btns { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }

/* popovers (menus, pickers) */
details.pop { position: relative }
details.pop > summary { list-style: none }
details.pop > summary::-webkit-details-marker { display: none }
.popbox { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; min-width: 240px; max-width: 360px; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 10px; box-shadow: var(--pop-shadow); padding: 6px; display: grid; gap: 1px }
.popbox.right { left: auto; right: 0 }
.popbox button { justify-content: flex-start; border: 0; background: none; width: 100%; height: 32px; gap: 10px; padding: 0 10px }
.popbox button:hover { background: var(--hover) }
.popbox button .faint { margin-left: auto; font-size: 12px }
.popbox hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; width: 100% }
.popbox .search { margin: 2px 2px 6px }
.poplist { max-height: 320px; overflow: auto; display: grid; gap: 1px }

/* sidebar */
aside { background: var(--side); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; padding: 12px 10px; overflow: auto }
.phead { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 4px 10px; font-size: 11.5px; color: var(--faint); font-weight: 600 }
.phead button { height: 24px; width: 24px }
#repoSearch { margin: 0 2px 6px }
.plist { display: grid; gap: 1px; max-height: 36vh; overflow: auto }
.plist button { justify-content: flex-start; border: 0; background: none; height: auto; min-height: 34px; padding: 5px 8px; gap: 10px; border-radius: 8px; text-align: left; font-weight: 500 }
.plist button:hover { background: var(--hover) }
.plist button.on { background: var(--sel); color: var(--accent) }
.plist .who b { font-size: 13.5px; font-weight: 600 }
.tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; color: #fff; background: var(--accent); flex: none; font-size: 14px }
.tile.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 11px }
.who { min-width: 0; flex: 1 }
.who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px }
.who span { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
nav.side { display: grid; gap: 1px; margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--rule) }
nav.side button { justify-content: flex-start; border: 0; background: none; height: 32px; padding: 0 10px; gap: 10px; border-radius: 7px; font-weight: 500 }
nav.side button .ic { color: var(--muted) }
nav.side button:hover { background: var(--hover) }
nav.side button.on { background: var(--sel); color: var(--accent) }
nav.side button.on .ic { color: var(--accent) }
nav.side button.warn { color: var(--warn); background: var(--warn-bg) }
nav.side button.warn .ic { color: var(--warn) }
nav.side .count { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 600 }
nav.side .group { font-size: 11.5px; color: var(--faint); padding: 16px 10px 4px; font-weight: 600 }
.side-foot { margin-top: auto; padding-top: 10px; display: grid; gap: 1px }
.side-foot > button { justify-content: flex-start; border: 0; background: none; height: 30px; color: var(--muted); gap: 10px; padding: 0 10px }
.side-foot > button:hover { background: var(--hover); color: var(--ink) }
#gitlog { border-top: 1px solid var(--rule); padding: 8px 2px 6px; margin-bottom: 4px }
#gitlog summary { cursor: pointer; font-size: 12.5px; color: var(--muted); padding: 0 8px; display: flex; gap: 8px; align-items: center }
#gitlog p { font-size: 11.5px; color: var(--faint); margin: 6px 8px }
#cmds { font: 11.5px/1.45 var(--mono); padding: 0 8px; list-style: none; max-height: 30vh; overflow: auto; margin: 4px 0 0 }
#cmds li { padding: 3px 0; border-bottom: 1px solid var(--rule); word-break: break-all; color: var(--muted) }
#cmds li.bad { color: var(--danger) }

/* main */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0 }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--rule); flex-wrap: wrap }
.picker > summary { height: 32px; font-weight: 600 }
.picker > summary .ic:first-child { color: var(--accent) }
.picker .popbox { width: 320px }
#content { flex: 1; overflow: auto; padding: 20px 24px 90px; min-height: 0 }
.vhead { display: flex; align-items: center; gap: 8px; margin: 22px 0 12px; flex-wrap: wrap }
.vhead h2 { font-size: 20px; font-weight: 650; margin-right: auto }
.vhead.first { margin-top: 0 }

/* the next-step nudge */
.next { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent-line) }
.next .tilebig { width: 44px; height: 44px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none }
.next .t { flex: 1; min-width: 0 }
.next .t b { display: block; font-size: 16px; font-weight: 650 }
.next .t span { display: block; color: var(--muted); margin-top: 2px }
.next .acts { display: flex; gap: 8px; flex-wrap: wrap }
.next.warn { background: var(--warn-bg); border-color: var(--warn-line) }
.next.warn .tilebig { background: var(--warn-line); color: #3D2600 }
.next.tip { background: var(--sunk); border-color: var(--rule) }
.next.tip .tilebig { background: var(--hover); color: var(--ink) }
.next.done { background: var(--ok-bg); border-color: transparent }
.next.done .tilebig { background: var(--ok); color: var(--bg) }
.tips { margin-top: 6px }
.tips ul { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 6px }
.tips li { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; border-radius: 9px; border: 1px solid var(--rule) }
.tips li > .ic { color: var(--muted) }
.tips li.warn > .ic { color: var(--warn) }
.tips li > span { flex: 1; min-width: 0 }

/* lists */
.list { border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); overflow: hidden }
.lhead { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--sunk); font-size: 12.5px; color: var(--muted); font-weight: 600 }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--rule) }
.row:last-child { border-bottom: 0 }
.row.sel { background: var(--sel) }
.row > .main { flex: 1; min-width: 0 }
.row .name { font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; overflow-wrap: anywhere }
.row .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row .acts { display: flex; gap: 6px; align-items: center; flex: none }
.row > .lead { color: var(--muted) }
.row > .diff { flex-basis: 100%; max-height: 50vh }
.rows-wrap .row { flex-wrap: wrap }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--hover); color: var(--muted); white-space: nowrap }
.badge.here { background: var(--accent-soft); color: var(--accent) }
.badge.ok { background: var(--ok-bg); color: var(--ok) }
.badge.warn { background: var(--warn-bg); color: var(--warn) }
.badge.mono { font-family: var(--mono); font-weight: 500 }
.empty { color: var(--muted); padding: 36px 16px; text-align: center; display: grid; justify-items: center; gap: 6px }
.empty > .ic { color: var(--faint); margin-bottom: 4px }
.empty b { color: var(--ink) }
.empty .btns { justify-content: center; margin-top: 8px }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); margin-bottom: 14px }
.banner > div { flex: 1; min-width: 240px }

/* branches */
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--hover); gap: 2px }
.seg button { border: 0; background: transparent; height: 28px; color: var(--muted) }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 24, 40, .12) }
.seg .n { font-size: 11.5px; color: var(--faint); font-weight: 600 }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px }
.filters .search { flex: 1 1 220px; max-width: 340px }
.bulk { position: sticky; bottom: 14px; margin-top: 14px; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-radius: 12px;
  background: var(--ink); color: var(--bg); box-shadow: var(--pop-shadow); flex-wrap: wrap }
.bulk b { margin-right: auto }
.bulk button { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 30%, transparent) }
.bulk button:hover { background: color-mix(in srgb, currentColor 12%, transparent) }
.bulk button.danger-btn { background: var(--danger); border-color: var(--danger); color: var(--danger-ink) }

/* changes and history: two panes */
.split { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); min-height: 58vh; overflow: hidden }
.pane-l { border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0; max-height: 74vh }
.pane-r { min-width: 0; overflow: auto; max-height: 74vh; padding: 16px 18px }
.files { list-style: none; margin: 0; padding: 4px; flex: 1; overflow: auto }
.files li { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 7px; cursor: pointer }
.files li:hover { background: var(--hover) }
.files li.sel { background: var(--sel) }
.fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; min-width: 0 }
.fname bdi { direction: ltr }
.dir { color: var(--faint) }
.st { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font: 700 12px/1 var(--mono); flex: none }
.st.a { background: var(--add-bg); color: var(--add) }
.st.m { background: var(--accent-soft); color: var(--accent) }
.st.d { background: var(--del-bg); color: var(--del) }
.st.r { background: var(--hover); color: var(--ink) }
.st.c { background: var(--warn-bg); color: var(--warn) }
.commit { border-top: 1px solid var(--rule); padding: 12px; display: grid; gap: 8px; background: var(--sunk) }
.commit .opts { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted) }
.commit label { display: flex; gap: 6px; align-items: center; cursor: pointer }
.diff-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px }
.diff-head b { font-family: var(--mono); font-size: 13px; word-break: break-all }
.dtbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12.5px; flex-basis: 100% }
.dtbar .plus { color: var(--add); font-weight: 600 }
.dtbar .minus { color: var(--del); font-weight: 600 }
.seg.sm { padding: 2px }
.seg.sm button { height: 24px; font-size: 12px; padding: 0 9px }
.diff { border: 1px solid var(--rule); border-radius: 8px; overflow: auto; flex-basis: 100% }
table.dt { width: 100%; border-collapse: collapse; table-layout: fixed; font: 12.5px/1.55 var(--mono) }
.dt col.cn { width: 46px }
.dt td { padding: 0 10px 0 calc(10px + 1.1em); vertical-align: top; white-space: pre-wrap; overflow-wrap: anywhere }
.dt td.n { color: var(--faint); text-align: right; padding: 0 8px; user-select: none; white-space: nowrap; border-right: 1px solid var(--rule) }
.dt.split4 td.n:nth-child(3) { border-left: 1px solid var(--rule) }
.dt .add { background: var(--add-bg) }
.dt .del { background: var(--del-bg) }
.dt td.c.add::before, .dt tr.add td.c::before { content: "+"; display: inline-block; width: 1.1em; margin-left: -1.1em; color: var(--add) }
.dt td.c.del::before, .dt tr.del td.c::before { content: "−"; display: inline-block; width: 1.1em; margin-left: -1.1em; color: var(--del) }
.dt td.e { background: var(--sunk) }
.dt tr.file td { font: 600 13px/1.4 var(--font); background: var(--sunk); padding: 8px 12px; border-top: 1px solid var(--rule) }
.dt tr.file:first-child td { border-top: 0 }
.dt tr.hunk td { color: var(--accent); background: var(--sunk); padding: 2px 12px; font-size: 12px }
.dt tr.note td, .dt tr.sidehead td { color: var(--muted); padding: 3px 12px; font: 12px/1.4 var(--font) }
.dt tr.sidehead td { font-weight: 600; border-bottom: 1px solid var(--rule) }
.commits { list-style: none; margin: 0; padding: 4px; overflow: auto }
.commits li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; cursor: pointer }
.commits li:hover { background: var(--hover) }
.commits li.sel { background: var(--sel) }
.commits .main { min-width: 0; flex: 1 }
.commits .subj { font-weight: 600; overflow-wrap: anywhere }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: #fff; flex: none }
.detail h3 { font-size: 17px; font-weight: 650 }
.detail .body { white-space: pre-wrap; margin-top: 8px; color: var(--muted) }
.detail .by { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin: 10px 0 14px }
.detail h4 { font-size: 13px; color: var(--muted); margin: 18px 0 8px }

/* forms */
.helpq { width: 24px; height: 24px; margin-left: 4px; vertical-align: -3px; color: var(--faint) }
.helpq:hover { color: var(--accent) }
.glist .gsec { cursor: default; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); padding: 12px 10px 4px }
.glist .gsec:hover { background: none }
.glist li:not(.gsec) { padding: 6px 10px }
.gtext { max-width: 760px; line-height: 1.6 }
.gtext h3 { font-size: 20px; font-weight: 650; margin: 2px 0 10px }
.gtext h4 { font-size: 15px; margin: 18px 0 6px }
.gtext p, .gtext ul, .gtext ol, .gtext pre { margin: 0 0 12px }
.gtext ul, .gtext ol { padding-left: 22px }
.gtext li { margin: 4px 0 }
.gtext a { color: var(--accent) }
.gtext code { background: var(--hover); padding: 1px 5px; border-radius: 4px }
.gtext pre { font: 12.5px/1.5 var(--mono); background: var(--hover); padding: 10px 12px; border-radius: 8px; overflow: auto }
.tipbox { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 8px; padding: 10px 12px; margin: 0 0 12px }
.tipbox .ic { color: var(--accent); flex: none; margin-top: 4px }
.tipbox p { margin: 0 }
.gnext { margin-top: 24px }
.card { border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; background: var(--panel); margin-bottom: 14px }
.card h3 { font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; margin-bottom: 4px }
.card h3 .ic { color: var(--muted) }
.card > .hint { margin-bottom: 12px }
.form { display: flex; gap: 8px; flex-wrap: wrap }
.form input { flex: 1 1 200px }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
ol.steps { padding-left: 20px; margin: 0 0 12px; color: var(--muted); display: grid; gap: 4px }
ol.steps a, .help a { color: var(--accent) }
.switch { display: flex; gap: 10px; align-items: center; cursor: pointer; font-weight: 500 }
pre.out { font: 12.5px/1.5 var(--mono); background: var(--sunk); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; overflow: auto; max-height: 60vh; white-space: pre-wrap; margin-top: 12px }
.help dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px }
.help dt { font-weight: 650; color: var(--ink) }
.help dd { margin: 2px 0 0; color: var(--muted) }
dialog .help dl { grid-template-columns: 1fr }

/* conflicts */
.cf-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px }
.cf-files { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px }
.cf-files button.on { background: var(--sel); border-color: var(--accent-line); color: var(--accent) }
.cf-head h3 { margin: 0; font-family: var(--mono); font-size: 14px; word-break: break-all }
pre.ctx, .blk pre { font: 12.5px/1.55 var(--mono); margin: 0; padding: 8px 12px; white-space: pre-wrap; word-break: break-word }
pre.ctx { color: var(--muted); opacity: .7 }
.gap { display: block; font-family: var(--font); font-size: 12px; padding: 2px 0; border-block: 1px dashed var(--rule); margin: 4px 0 }
.blk { border: 1px solid var(--warn-line); border-radius: 9px; margin: 8px 0; overflow: hidden }
.blk.done { border-color: var(--rule); border-left: 3px solid var(--add) }

.blk-bar.under { justify-content: flex-start; border-top: 1px solid var(--rule) }
.sides { display: grid; grid-template-columns: 1fr 1fr }
.side + .side { border-left: 1px solid var(--rule) }
.side.mine pre { background: var(--accent-soft) }
.side.theirs pre { background: var(--add-bg) }
.blk textarea { border: 0; border-radius: 0; font: 12.5px/1.55 var(--mono); min-height: 120px }
.advice { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--accent-soft); border-bottom: 1px solid var(--rule); font-size: 13px }

.advice > div { flex: 1 }
.advice > .ic { color: var(--accent) }
.advice.warn > .ic { color: var(--warn) }
.side pre .ln { display: block; min-height: 1.55em; padding-left: 6px; margin-left: -6px }
.side pre .same { opacity: .5 }
.side pre .uniq { font-weight: 600 }
.side.mine pre .uniq { box-shadow: inset 3px 0 var(--accent) }
.side.theirs pre .uniq { box-shadow: inset 3px 0 var(--add) }
.blk-bar .badge { margin-left: auto }
details.orig { border-top: 1px solid var(--rule) }
details.orig summary { cursor: pointer; padding: 6px 12px; font-size: 12.5px; color: var(--muted) }
details.orig pre { background: var(--sunk); color: var(--muted) }
textarea.big { min-height: 55vh; font: 12.5px/1.55 var(--mono) }

/* overlays */
#working { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 40; padding: 7px 14px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600; box-shadow: var(--pop-shadow) }
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 40; width: min(560px, calc(100vw - 32px)) }
.toast { display: flex; gap: 10px; align-items: center; padding: 10px 10px 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); box-shadow: var(--pop-shadow); animation: rise .18s ease-out }
.toast.err { background: var(--danger); color: var(--danger-ink); align-items: flex-start }
.toast.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line) }
.toast > div { flex: 1 }
.toast details { margin-top: 6px; font-size: 13px }
.toast pre { white-space: pre-wrap; font: 12px/1.45 var(--mono); max-height: 30vh; overflow: auto; margin: 6px 0 0 }
.toast .undo { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 40%, transparent); font-weight: 600 }
.toast .x { border: 0; background: none; color: inherit; padding: 0 6px; font-size: 18px; height: 26px }
@keyframes rise { from { transform: translateY(8px); opacity: 0 } }
dialog { border: 1px solid var(--rule); border-radius: 12px; padding: 22px 24px; width: min(520px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); box-shadow: var(--pop-shadow) }
dialog::backdrop { background: rgba(10, 15, 20, .4) }
dialog h2 { font-size: 18px; margin-bottom: 8px }
dialog .body { color: var(--muted); margin-bottom: 16px }
dialog .body ul { margin: 8px 0; padding-left: 20px; max-height: 30vh; overflow: auto }
dialog .body p + p, dialog .body ul + p { margin-top: 8px }
dialog input { width: 100%; margin-bottom: 16px; height: 34px }
dialog .btns { justify-content: flex-end }
body::before { content: ""; position: fixed; top: 0; left: 0; height: 3px; width: 30%; background: var(--accent); opacity: 0; z-index: 50; pointer-events: none }
body.busy::before { opacity: 1; animation: slide 1s ease-in-out infinite }
body.busy { cursor: progress }
@keyframes slide { from { left: -30% } to { left: 100% } }
@media (prefers-reduced-motion: reduce) { body.busy::before { animation: none; width: 100%; opacity: .6 } .toast { animation: none } }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; height: auto }
  aside { border-right: 0; border-bottom: 1px solid var(--rule); overflow: visible }

  .sides { grid-template-columns: 1fr }
  .side + .side { border-left: 0; border-top: 1px solid var(--rule) }
  .next { flex-wrap: wrap }
}

// ---------- talking to the server ----------
let busyN = 0, workingTimer
const WORKING = { sync: 'Syncing with the server…', fetch: 'Checking the server…', lost: 'Searching for lost work…', merge: 'Merging…', rebase: 'Rebasing…',
  commit: 'Committing…', switch: 'Switching branch…', add_repo: 'Looking inside that folder…', merge_preview: 'Checking for clashes…', raw: 'Running…', sync_branches: 'Syncing branches…',
  publish_branches: 'Uploading…', delete_remote_branches: 'Deleting from the server…', track_branches: 'Making copies…', rename_branch: 'Renaming…',

function busy(on, op) {
  busyN += on ? 1 : -1
  document.body.classList.toggle('busy', busyN > 0)
  clearTimeout(workingTimer)
  const pill = $('#working')
  if (busyN > 0 && on) workingTimer = setTimeout(() => { pill.textContent = WORKING[op] || 'Working…'; pill.hidden = false }, 400)
  if (busyN === 0) pill.hidden = true

// bg: background calls (ping, auto-fetch) don't show the busy bar and fail silently.
async function api(op, args = {}, bg = false) {
  if (!bg) busy(true, op)
  let r
  try {
    const res = await fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN }, body: JSON.stringify({ op, ...args }) })
    r = await res.json()
  } catch {
    r = { ok: false, error: 'KrazyGit is closed. Open it again to keep going.' }
    if (!S.closed) { S.closed = 'stopped'; render() }
  } finally {
    if (!bg) busy(false)
  }
  if (r.cmds?.length) logCmds(r.cmds, r.ok)
  if (!r.ok) throw r
  return r.data
}

// Run a project action, report it (with an Undo button when undo(d) returns one), then reload everything.
async function act(op, args = {}, done, undo) {
  S.cf = null
  let d
  try { d = await api(op, { repo: S.repo, ...args }) } catch (e) { showError(e); await refresh(); return null }
  if (d?.conflicts) toast('Some changes clash. Choose what to keep in Conflicts.', 'warn')
  else if (done) toast(typeof done === 'function' ? done(d) : done, 'ok', null, undo?.(d), d?.pr_url)
  await refresh()
  return d ?? true
}
// Undo helpers: move the branch back to where it was, or pull items back out of the Recycle bin.
const undoMove = (mode = 'keep') => d => d?.before && (() => act('reset_to', { sha: d.before, mode }, 'Undone.'))
const undoBin = kind => d => d?.ref && (() => act('restore', { kind, sha: d.sha, name: d.name, ref: d.ref }, 'Undone.'))
const undoAll = (kind, list) => list.length ? async () => {
  for (const r of list) await api('restore', { repo: S.repo, kind, sha: r.sha, name: r.name, ref: r.ref })
  toast('Undone.')
  await refresh()
} : null
const undoDiscard = d => d?.backup && (() => act('stash_apply', { ref: d.backup }, 'Undone. Your changes are back.'))

// bg: a background check. It stays quiet (no busy bar, no error screen) and leaves the page alone when nothing changed.
async function refresh(bg = false) {
  if (!S.repo || S.closed) return bg || render()
  const repo = S.repo
  let st
  try { st = await api('state', { repo }, bg) } catch (e) { if (bg) return; S.st = null; S.err = e; return render() }
  if (S.repo !== repo) return
  // Every few minutes, quietly check the server so "new commits to download" shows up without anyone asking.
  if (Object.keys(st.remotes).length && Date.now() - S.fetched > 5 * 60e3) {
    S.fetched = Date.now()
    api('auto_fetch', { repo }, true).then(() => { if (S.repo === repo && !acting) refresh(true) }).catch(() => {})
  }
  if (bg && JSON.stringify(st) === JSON.stringify(S.st)) return
  const had = S.st?.files.some(f => f.conflict), has = st.files.some(f => f.conflict)
  if (has && !had) S.tab = 'conflicts'
  if (S.tab === 'conflicts' && !has && !st.doing) S.tab = 'changes'
  S.st = st; S.err = null
  await loadTab(bg).catch(bg ? () => {} : showError)
  render()
}

async function loadTab(bg = false) {
  const r = { repo: S.repo }, s = S.st, api_ = (op, args) => api(op, args, bg)
  if (S.tab === 'changes') {
    const f = s.files.find(f => f.path === S.sel && !f.conflict)
    S.sel = f ? f.path : null
    S.diff = f ? await api_('diff', { ...r, path: f.path, orig: f.orig, untracked: f.x === '?' }) : ''
  }
  if (S.tab === 'history') S.log = await api_('log', { ...r, ref: S.logRef, search: S.search, mode: S.smode, limit: S.logLimit })
  if (S.tab === 'tags' && hasRemote(s)) {  // in the background: a slow or offline server mustn't hold up the page
    const repo = S.repo
    api('remote_tags', r, true).then(t => { if (S.repo === repo && S.tab === 'tags') { S.rtags = t; render() } }).catch(() => {})
  }
  if (S.tab === 'bin') S.bin = await api_('bin', r)
  if (S.tab === 'undo') S.reflog = await api_('reflog', r)
  if (S.tab === 'stashes' && S.stashView) {
    if (s.stashes.some(x => x.ref === S.stashView)) S.stashDiff = await api_('stash_diff', { ...r, ref: S.stashView })

  }
  if (S.tab === 'conflicts') {
    const files = s.files.filter(f => f.conflict), f = files.find(f => f.path === S.cfPath) || files[0]
    S.cfPath = f?.path
    if (f && S.cf?.path !== f.path) S.cf = await loadConflict(f)

}

// ---------- feedback ----------
function toast(text, tone = 'ok', detail = null, undo = null, link = null) {
  const el = document.createElement('div')
  el.className = 'toast ' + tone
  el.innerHTML = `<div>${esc(text)}${detail ? `<details><summary>What Git said</summary><pre>${esc(detail)}</pre></details>` : ''}</div>
    ${link ? `<a class="btnlike undo" href="${esc(link)}" target="_blank" rel="noopener">${ic('arrow')}Open pull request</a>` : ''}
    ${undo ? `<button class="undo">${ic('undo')}Undo</button>` : ''}<button class="x" aria-label="Close">×</button>`
  el.querySelector('.x').onclick = () => el.remove()
  if (undo) el.querySelector('.undo').onclick = () => { el.remove(); guarded(undo) }
  $('#toasts').append(el)
  if (tone !== 'err') setTimeout(() => el.remove(), link ? 20000 : undo || tone === 'warn' ? 10000 : 5000)
}
function showError(e) {
  const msg = e?.error ?? String(e)
  toast(e?.hint || msg.split('\n')[0], 'err', e?.hint || msg.includes('\n') ? msg : null)
}
function logCmds(cmds, ok) {
  const list = $('#cmds'), time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  for (const c of cmds) list.insertAdjacentHTML('afterbegin', `<li class="${ok ? '' : 'bad'}" title="${time}">${esc(c)}</li>`)
  while (list.children.length > 200) list.lastChild.remove()
}

// A small modal. Returns the chosen button's value (or the typed text for prompts), null when cancelled.
// A prompt with several buttons returns { text, choice }.
function ask({ title, body = '', input, value = '', buttons = [['OK', true]] }) {
  return new Promise(resolve => {
    dlg.innerHTML = `<form><h2>${esc(title)}</h2>${body ? `<div class="body">${body}</div>` : ''}
      ${input !== undefined ? `<input id="dlgIn" value="${esc(value)}" placeholder="${esc(input)}" autofocus>` : ''}
      <div class="btns"><button type="button" data-close>Cancel</button>${buttons.map(([label, , cls], i) =>
        `<button value="${i}" class="${cls ?? (i === buttons.length - 1 ? 'primary' : '')}">${esc(label)}</button>`).join('')}</div></form>`
    // Answer straight from the click or key press; the dialog's own close event isn't reliable in every browser.
    let answered = false
    const answer = v => { if (answered) return; answered = true; if (dlg.open) dlg.close(); resolve(v) }
    dlg.querySelector('form').onsubmit = e => {
      e.preventDefault()
      const choice = buttons[+(e.submitter?.value ?? buttons.length - 1)][1], text = input !== undefined && dlg.querySelector('#dlgIn').value.trim()
      answer(input === undefined ? choice : buttons.length > 1 ? { text, choice } : text)
    }
    const main = buttons.findIndex(b => /primary/.test(b[2] ?? '')), pick = main < 0 ? buttons.length - 1 : main
    dlg.querySelector('#dlgIn')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); dlg.querySelector('form').requestSubmit(dlg.querySelector(`.btns [value="${pick}"]`)) } })
    dlg.querySelector('[data-close]').onclick = () => answer(null)
    dlg.oncancel = e => { e.preventDefault(); answer(null) }  // Escape key
    dlg.onclose = () => answer(null)
    dlg.showModal()
  })
}
const confirmIt = (title, body, label, cls) => ask({ title, body, buttons: [[label, true, cls]] })

const pushed = s => !!s.upstream && !s.ahead  // the last commit is already on the server

const DOING = { merge: 'Merge', rebase: 'Rebase', 'cherry-pick': 'Copying a commit', revert: 'Undoing a commit' }

function toolbar(s) {

}

}
function pickerList(s, q) {

  return list.length ? list.map(b => {
    const cur = b.name === s.branch && !s.detached
    return `<button data-act="${cur ? 'noop' : 'switch'}" data-name="${esc(b.name)}">${ic(cur ? 'check' : 'branch')}<span class="ell">${esc(b.name)}</span><span class="faint">${esc(b.when)}</span></button>`
  }).join('') : '<p class="hint" style="padding:8px 10px">No branch matches.</p>'
}
const dlOnly = s => s.download_only.includes(s.branch) && !s.detached
const followServer = s => s.follow ? serverName(s, s.follow.ref.split('/')[0]) : branchServer(s)
function syncButton(s) {
  const host = remoteHost(s)

  if (!s.has_commits || s.detached || s.doing) return btn('Sync', 'noop', {}, '', true, 'sync', s.doing ? 'Finish the merge first' : s.detached ? 'Switch to a branch first' : 'Make a commit first')
  if (dlOnly(s)) return btn(`Get updates${s.follow?.behind ? ' ↓' + s.follow.behind : ''}`, 'sync', {}, s.follow?.behind ? 'primary' : '', false, 'down',
    `${s.branch} only downloads from ${followServer(s)}. It never uploads.`)
  if (!s.upstream) return btn(`Publish to ${host}`, 'sync', {}, 'primary', false, 'up', `Upload this branch to ${host} for the first time`)
  const counts = [s.behind && `↓${s.behind}`, s.ahead && `↑${s.ahead}`].filter(Boolean).join(' ')

// Everything worth doing next, most important first. The first one becomes the big "Next step" card.
function suggestions(s) {

  const conf = s.files.filter(f => f.conflict).length, n = s.files.length - conf, host = esc(remoteHost(s)), onChanges = S.tab === 'changes'
  if (conf) add('warn', 'alert', `${plural(conf, 'file')} need${conf === 1 ? 's' : ''} your decision`, 'Both sides changed the same lines. Pick what to keep.', ['Fix conflicts', 'tab', { tab: 'conflicts' }])
  else if (s.doing) add('warn', 'checkc', `Finish the ${s.doing}`, 'All conflicts are fixed.', [s.doing === 'merge' ? 'Finish merge' : 'Continue', 'finish', { kind: s.doing, action: 'continue' }])
  if (!s.who.name || !s.who.email) add('warn', 'user', 'Tell Git who you are', 'Your name goes on every commit you make.', ['Add my name', 'setWho'])
  if (s.detached && !s.doing) add('warn', 'alert', 'You’re on an old commit, not a branch', 'New commits here are easy to lose.',
    ...(s.prev_branch ? [[`Back to ${s.prev_branch}`, 'switch', { name: s.prev_branch }]] : []), ['Create a branch here', 'newBranch'])
  if (!s.has_commits && !onChanges) add('info', 'edit', n ? 'Make your first commit' : 'Add some files', n ? 'Save a first snapshot of this project.' : 'Put files in this folder, then commit them.',
    ...(n ? [['Review changes', 'tab', { tab: 'changes' }]] : []))
  else if (n && !s.doing && !onChanges) add('info', 'edit', n === 1 ? 'Commit your change' : `Commit your ${n} changes`, 'Save a snapshot you can always go back to.', ['Review and commit', 'tab', { tab: 'changes' }])
  if (dlOnly(s) && !s.doing) {  // e.g. master: it follows the team server and never uploads
    const f = s.follow
    if (f?.ahead) add('warn', 'alert', `${esc(s.branch)} has ${plural(f.ahead, 'commit')} that won’t be uploaded`, `${esc(s.branch)} only downloads. Move them to a branch you can upload.`,
      ['Move them to a new branch', 'moveCommits'])
    else if (f?.behind) add('info', 'down', `Get ${plural(f.behind, 'new commit')} from ${esc(followServer(s))}`, `Keeps ${esc(s.branch)} the same as the team’s.`, ['Get updates', 'sync'])
  }
  const linked = upRemote(s), oddOneOut = !dlOnly(s) && linked && s.main_remote && linked !== s.main_remote && !s.doing && !s.detached && !store(`keep:${s.path}:${s.branch}`)
  if (oddOneOut) {  // linked to a different server than the rest: its updates (and uploads) are going to the wrong place
    const there = s.remote_branches.some(b => b.name === `${s.main_remote}/${s.branch}`)
    add('warn', 'cloud', `${esc(s.branch)} syncs with ${esc(serverName(s, linked))}`, there
      ? `Your other branches use ${esc(serverName(s))}, which has its own ${esc(s.branch)}. Sync is getting updates from the wrong place.`
      : `Your other branches go to ${esc(serverName(s))}.`,
      [`${there ? 'Sync' : 'Upload'} with ${serverName(s)} instead`, 'moveRemote', { remote: s.main_remote, there: there ? '1' : '' }], [`Keep ${serverName(s, linked)}`, 'keepRemote'])
  }
  if (!oddOneOut && !dlOnly(s) && s.behind && !s.doing) add('info', 'down', `Get ${plural(s.behind, 'new commit')} from ${esc(branchServer(s))}`, 'Someone uploaded changes you don’t have yet.', ['Sync now', 'sync'])
  else if (!oddOneOut && !dlOnly(s) && s.ahead && !s.doing) add('info', 'up', `Back up ${plural(s.ahead, 'commit')} to ${esc(branchServer(s))}`, 'Right now they’re only on this computer.', ['Sync now', 'sync'])
  if (s.has_commits && !s.upstream && !s.detached && !s.doing && hasRemote(s) && !dlOnly(s)) add('info', 'up', `Publish ${esc(s.branch)} to ${host}`, 'It’s only on this computer so far.', ['Publish', 'sync'])
  const left = !s.detached && s.stashes.find(x => /(Krazy|Easy)Git: left on (.+)$/.exec(x.msg)?.[2] === s.branch)
  if (left) add('info', 'box', 'Bring back your unfinished changes', `You left them on ${esc(s.branch)} when you switched away.`, ['Bring them back', 'stashApply', { ref: left.ref, pop: '1' }])
  const tidy = s.merged.filter(b => b !== s.branch && !MAIN.includes(b))
  if (tidy.length) add('tip', 'trash', `Tidy up ${plural(tidy.length, 'merged branch', 'merged branches')}`, `${esc(listJoin(tidy))} ${tidy.length === 1 ? 'is' : 'are'} already in ${esc(s.branch)}.`, ['Tidy up', 'deleteMerged'])
  if (MAIN.includes(s.branch) && n && s.has_commits && !s.doing) add(dlOnly(s) ? 'warn' : 'tip', 'branch', 'Try working on a branch', dlOnly(s) ? `${esc(s.branch)} only downloads, so commits here can’t be uploaded.` : `You’re changing ${esc(s.branch)} directly. A branch keeps experiments separate.`, ['Move changes to a new branch', 'newBranch'])
  for (const f of s.files) {
    const m = f.x === '?' && f.path.match(JUNK)

  if (!hasRemote(s) && s.has_commits) add('tip', 'cloud', 'Back up this project online', 'Right now it only lives on this computer.', ['Back up online', 'tab', { tab: 'settings' }])
  return out
}
const tipKey = (s, x) => `${s.path}|${s.branch}|${x.icon}|${x.btns[0]?.[1] || ''}`
const canHide = x => x.tone !== 'warn'
function nextStep(s) {
  const every = suggestions(s), all = every.filter(x => !(canHide(x) && HIDDEN.has(tipKey(s, x)))), changes = s.files.length
  const hide = x => canHide(x) ? iconBtn('x', 'Hide until KrazyGit is reopened', 'hideTip', { key: tipKey(s, x) }) : ''
  if (!all.length) return changes || every.length ? '' : `<section class="next done"><div class="tilebig">${ic('check', 22)}</div><div class="t"><b>All caught up</b>
    <span>${s.upstream ? `Everything is committed and backed up on ${esc(remoteHost(s))}.` : 'Everything is committed.'}</span></div></section>`
  const [top, ...rest] = all
  return `<section class="next ${top.tone}"><div class="tilebig">${ic(top.icon, 22)}</div><div class="t"><b>${top.title}</b>${top.sub ? `<span>${top.sub}</span>` : ''}</div>
    <div class="acts">${top.btns.map(([l, a, d], i) => btn(l, a, d, i ? 'big' : 'primary big')).join('')}${hide(top)}</div></section>
    ${rest.length ? `<div class="tips">${btn(S.tipsOpen ? 'Hide other suggestions' : plural(rest.length, 'more suggestion'), 'tips', {}, 'link')}
      ${S.tipsOpen ? `<ul>${rest.map(x => `<li class="${x.tone}">${ic(x.icon)}<span><b>${x.title}</b> <span class="hint">${x.sub}</span></span>
        ${x.btns.map(([l, a, d]) => btn(l, a, d)).join('')}${hide(x)}</li>`).join('')}</ul>` : ''}</div>` : ''}`
}

// Unified diff text -> rows with line numbers. Header lines only count before a file's first hunk,
// so a removed line like "-- comment" is never mistaken for a "---" header.
// Syntax colours from highlight.js, one line at a time (simple, and a broken line can't spoil the rest).
// Unknown file types, or a missing library, just show plain text.
const langOf = path => { const ext = (String(path).match(/\.([\w+-]+)$/) || [])[1]?.toLowerCase(); return ext && window.hljs?.getLanguage(ext) ? ext : null }

const shownCode = (t, lang) => t.replace(/\r?\n$/, '').split(/\r?\n/).map(l => code(l, lang)).join('\n')

    else if ((m = l.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@ ?(.*)/))) { inHunk = true; o = +m[1]; n = +m[2]; rows.push({ t: 'hunk', text: m[3] }) }
    else if (!inHunk) { if (/^(new file|deleted file|similarity|rename |copy |old mode|new mode|Binary files)/.test(l)) rows.push({ t: 'note', text: l }) }
    else if (l[0] === '-') rows.push({ t: 'del', o: o++, text: l.slice(1), lang })
    else if (l[0] === '+') rows.push({ t: 'add', n: n++, text: l.slice(1), lang })
    else if (l[0] !== '\\') rows.push({ t: 'ctx', o: o++, n: n++, text: l.slice(1), lang })
  }
  return rows
}
const wide = (r, cols) => `<tr class="${r.t}"><td colspan="${cols}">${esc(r.text) || '&nbsp;'}</td></tr>`
function diffInline(rows) {
  return `<table class="dt"><colgroup><col class="cn"><col class="cn"><col></colgroup>${rows.map(r => ['file', 'hunk', 'note'].includes(r.t) ? wide(r, 3)
    : `<tr class="${r.t}"><td class="n">${r.o ?? ''}</td><td class="n">${r.n ?? ''}</td><td class="c">${code(r.text, r.lang)}</td></tr>`).join('')}</table>`

// ---------- Guide ----------
// guide.md: "# Section", then "## Title {#id}" articles. A small Markdown subset: paragraphs, - and 1. lists, > tips,

let GUIDE = null
const help = id => `<button class="icon ghost helpq" data-act="guide" data-id="${id}" title="Learn more in the guide" aria-label="Learn more in the guide">${ic('help', 15)}</button>`
function parseGuide(src) {

    const m = block.match(/^(#{1,2}) (.+?)(?: \{#([\w-]+)\})?\n/)

}

  if ((m = href.match(/^#tab:(\w+)$/)) && TABS[m[1]]) return `<a href="#" data-act="guideTab" data-tab="${m[1]}">${text}</a>`

}

    if (block.startsWith('### ')) return `<h4>${mdInline(block.slice(4))}</h4>`
    if (block.startsWith('> ')) return `<div class="tipbox">${ic('bulb')}<p>${mdInline(block.replace(/^> ?/gm, ''))}</p></div>`
    const items = block.split(/\n(?=- |\d+\. )/)

  }).join('')
}

// ---------- Conflicts ----------
function parseConflicts(text) {
  const segs = []
  let buf = '', cur = null
  for (const l of text.split(/(?<=\n)/)) {
    if (!cur && /^<{7}( |\r?\n|$)/.test(l)) { if (buf) segs.push({ text: buf }); buf = ''; cur = { ours: '', base: '', theirs: '', lo: l.slice(8).trim(), part: 'ours' }; continue }
    if (cur) {
      if (cur.part === 'ours' && /^\|{7}( |\r?\n|$)/.test(l)) cur.part = 'base'
      else if (cur.part !== 'theirs' && /^={7}(\r?\n|$)/.test(l)) cur.part = 'theirs'
      else if (cur.part === 'theirs' && /^>{7}( |\r?\n|$)/.test(l)) { cur.lt = l.slice(8).trim(); segs.push(cur); cur = null }
      else cur[cur.part] += l
      continue
    }
    buf += l
  }
  if (cur) return null // unterminated markers: fall back to editing by hand
  if (buf) segs.push({ text: buf })
  return segs
}
async function loadConflict(f) {
  const cf = { path: f.path }
  if (f.x === 'D' || f.y === 'D') return cf
  try {
    const r = await api('read_file', { repo: S.repo, path: f.path })
    if (r.binary) return { ...cf, binary: true }
    const segs = parseConflicts(r.text)
    if (segs) {  // attach the original to each clash, but only where it lines up exactly with what's in the file
      const base = await api('conflict_base', { repo: S.repo, path: f.path }).catch(() => null)
      const fb = segs.filter(x => x.text === undefined), bb = ((base && parseConflicts(base)) || []).filter(x => x.text === undefined)
      const norm = t => t.replace(/\r\n/g, '\n')
      const clean = t => !/^[<>=|]{7,}/m.test(t)  // a criss-cross history leaves Git's own leftover markers in the original
      if (bb.length === fb.length) fb.forEach((x, i) => { if (norm(bb[i].ours) === norm(x.ours) && norm(bb[i].theirs) === norm(x.theirs) && clean(bb[i].base)) Object.assign(x, { base: bb[i].base, hasBase: true }) })
    }
    return { ...cf, raw: r.text, crlf: r.text.includes('\r\n'), segs }
  } catch (e) { return { ...cf, error: e.hint || e.error } }
}
function sides(s) {
  return {
    merge: [`Yours (${s.branch})`, 'Incoming'], rebase: ['The branch you’re rebasing onto', 'Your commit'],
    'cherry-pick': ['Yours', 'The copied commit'], revert: ['Current', 'The undo'],
  }[s.doing] || ['Your current files', 'The stash']
}
const eolOf = cf => cf.crlf ? '\r\n' : '\n'
const joinLines = (a, b, eol) => a && !a.endsWith('\n') ? a + eol + b : a + b
const shown = t => esc(t.replace(/\r?\n$/, ''))
function composed(cf, keepMarkers) {
  return cf.segs.map(x => x.text ?? x.res ?? (keepMarkers ? `<<<<<<< ${x.lo}\n${x.ours}=======\n${x.theirs}>>>>>>> ${x.lt}\n` : '')).join('')
}
const keyLines = t => t.split(/\r?\n/).map(l => l.trim()).filter(Boolean)
// Compare the two sides (and the original, when known) to suggest what to keep, and say why.
function advise(x, mine, theirs) {
  const O = new Set(keyLines(x.ours)), T = new Set(keyLines(x.theirs)), B = x.hasBase ? new Set(keyLines(x.base)) : new Set()
  const onlyO = [...O].filter(l => !T.has(l)), onlyT = [...T].filter(l => !O.has(l))
  const removedO = [...B].filter(l => !O.has(l)), removedT = [...B].filter(l => !T.has(l))
  const both = { onlyO, onlyT }
  if (!onlyO.length && !onlyT.length) return { ...both, pick: 'ours', why: 'Both sides have the same lines; only the order or spacing differs. Either is fine.' }
  if (!onlyT.length && !removedT.some(l => O.has(l)))
    return { ...both, pick: 'ours', why: `${mine} already has every line from ${theirs.toLowerCase()}, plus ${plural(onlyO.length, 'line')} of its own. Keeping it loses nothing.` }
  if (!onlyO.length && !removedO.some(l => T.has(l)))
    return { ...both, pick: 'theirs', why: `${theirs} already has every line from ${mine.toLowerCase()}, plus ${plural(onlyT.length, 'line')} of its own. Keeping it loses nothing.` }
  if (removedO.some(l => removedT.includes(l)))
    return { ...both, pick: null, why: 'Both sides changed the same line in different ways, so only you can decide which is right. If unsure, ask whoever made the other change.' }

const HOW_TO_CHOOSE = `<ol style="padding-left:20px;margin:0;display:grid;gap:8px">

function conflictFile(f, [mine, theirs]) {

    <textarea id="cfm" class="big" spellcheck="false" aria-label="File contents">\n${esc(cf.manual ?? cf.raw)}</textarea>

function context(text, first, last, lang) {

  const head = first ? [] : lines.slice(0, 3), tail = last ? [] : lines.slice(-3)
  return `<pre class="ctx">${head.length ? shownCode(head.join(''), lang) : ''}<span class="gap">${plural(lines.length - head.length - tail.length, 'unchanged line')}</span>${tail.length ? shownCode(tail.join(''), lang) : ''}</pre>`

  if (x.res !== undefined) return `<div class="blk done"><div class="blk-bar"><span>${ic('check', 14)} ${esc(x.choice)}</span>${btn('Change', 'cfUndo', { i }, 'link')}</div><pre>${shownCode(x.res, lang) || '<i>(removed)</i>'}</pre></div>`

  const extra = only => `<span class="badge ${only.length ? 'here' : ''}">${only.length ? `${plural(only.length, 'line')} only here` : 'nothing extra'}</span>`
  const side = (cls, name, text, other, only, pick) => `<div class="side ${cls}"><div class="blk-bar"><b>${name}</b>${extra(only)}

async function selectRepo(path) {

  store('repo', path || '')

}
async function addFolder(path) {
  const r = await api('add_repo', { path })
  if (r.added) { S.repos = await api('repos'); toast(`Added ${r.added.split('/').pop()}.`); return selectRepo(r.added) }
  const name = r.path.split('/').pop()
  if (r.found.length) {
    const c = await ask({ title: `Found ${plural(r.found.length, 'Git project')} inside ${name}`,
      body: `<ul>${r.found.map(p => `<li>${esc(p.slice(r.path.length + 1))}</li>`).join('')}</ul>`,
      buttons: [['Track the whole folder instead', 'init', ''], [`Add ${r.found.length === 1 ? 'it' : `all ${r.found.length}`}`, 'all', 'primary']] })
    if (c === 'all') { await api('add_many', { paths: r.found }); S.repos = await api('repos'); toast(`Added ${plural(r.found.length, 'project')}.`); return selectRepo(r.found[0]) }

// Returns the Recycle bin entry, or null if nothing was deleted.
async function deleteBranch(name) {
  try { return await api('delete_branch', { repo: S.repo, name }) } catch (e) {
    if (!/not fully merged/.test(e.error)) { showError(e); return null }
    if (!await confirmIt(`${name} has unmerged work`, 'Some commits on this branch aren’t on any other branch. Delete it anyway? You can still restore it from the Recycle bin.', 'Delete anyway', 'danger-btn')) return null
    return api('delete_branch', { repo: S.repo, name, force: true })
  }
}
// Deletes several local branches; asks once about any with unmerged work. Returns the Recycle bin entries.
async function deleteMany(names) {
  const gone = [], unmerged = []
  for (const name of names) {
    try { gone.push(await api('delete_branch', { repo: S.repo, name })) } catch (e) { if (/not fully merged/.test(e.error)) unmerged.push(name); else showError(e) }
  }
  if (unmerged.length && await confirmIt(`${plural(unmerged.length, 'branch has', 'branches have')} unmerged work`,
    `<ul>${unmerged.map(n => `<li>${esc(n)}</li>`).join('')}</ul><p>Some of their commits aren’t on any other branch. Delete them anyway? They stay restorable from the Recycle bin.</p>`, 'Delete anyway', 'danger-btn'))
    for (const name of unmerged) gone.push(await api('delete_branch', { repo: S.repo, name, force: true }))
  return gone

async function deleteRemote(names) {
  const host = remoteHost(S.st), mains = names.map(shortName).filter(n => MAIN.includes(n))
  if (!await confirmIt(`Delete ${plural(names.length, 'branch', 'branches')} from ${host}?`, `<ul>${names.map(n => `<li>${esc(shortName(n))}</li>`).join('')}</ul>

  S.bsel.clear()

// Git needs a name and email before the first commit: ask on the spot instead of failing.
async function ensureWho() {
  const w = S.st.who
  if (w.name && w.email) return true
  const name = w.name || await ask({ title: 'What’s your name?', body: 'Git puts your name and email on every commit. You only do this once.', input: 'Your name', buttons: [['Next', true]] })
  if (!name) return false
  const email = w.email || await ask({ title: 'And your email?', body: 'Use the email of your GitHub account, so your commits are linked to you there.', input: 'you@example.com', buttons: [['Save', true]] })
  if (!email) return false
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('That email doesn’t look right. Try again.', 'warn'); return false }
