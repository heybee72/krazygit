  stageAll: (d, el) => act(el.checked ? 'stage' : 'unstage'),
  amendToggle: (d, el) => { S.amend = el.checked; if (S.amend && !val('msg')) S.f.msg = S.st.last_message; render() },
  useSuggestion: () => { S.f.msg = suggestMsg(S.st.files.filter(f => !f.conflict)); render(); $('#msg')?.focus() },
  commit: async () => {
    if (!await ensureWho()) return
    if (dlOnly(S.st) && !S.amend) {
      const c = await ask({ title: `${S.st.branch} only downloads`, body: `Commits on ${esc(S.st.branch)} can’t be uploaded. Put this work on its own branch? Your changes come with you, and you can commit there.`,
        buttons: [[`Commit on ${S.st.branch} anyway`, 'here', ''], ['Create a branch', 'branch', 'primary']] })
      if (!c) return
      if (c === 'branch') return ACT.newBranch({})
    }
    const files = S.st.files.filter(f => !f.conflict)
    if (!files.length && !S.amend) return toast('There’s nothing to commit.', 'warn')
    if (S.amend && !await confirmIt('Add to your last commit?', `Your changes join “${esc(S.st.last_message.split('\n')[0])}” instead of making a new commit.`, 'Amend')) return
    let everything = !S.amend && !files.some(isStaged)
    const going = everything ? files : files.filter(isStaged)
    const list = fs => `<ul>${fs.map(f => `<li><code>${esc(f.path)}</code>${f.size > BIG ? ` (${mb(f.size)})` : ''}</li>`).join('')}</ul>`
    const edited = everything ? [] : going.filter(f => f.y === 'M')  // ticked, then changed again: Git would commit the ticked version
    if (edited.length) {
      const c = await ask({ title: 'You changed these after ticking them', body: `<p>The commit would include them as they were when you ticked them:</p>${list(edited)}`,
        buttons: [['Commit the ticked version', 'old', ''], ['Include my latest changes', 'new', 'primary']] })
      if (!c) return
      if (c === 'new') await api('stage', { repo: S.repo, paths: edited.map(f => f.path) })
    }
    const risky = going.filter(f => (f.x === '?' || f.x === 'A') && SECRET.test(f.path)), big = going.filter(f => f.size > BIG)
    let skip = []
    if (risky.length || big.length) {
      const c = await ask({ title: 'Check these files first',
        body: (risky.length ? `<p>These look like passwords or secret keys. Once they’re committed and uploaded, they’re very hard to remove:</p>${list(risky)}` : '') +
          (big.length ? `<p>These are very large. GitHub refuses files over 100 MB, and big files make every sync slow:</p>${list(big)}` : ''),
        buttons: [['Commit them anyway', 'go', 'danger'], ['Leave them out', 'skip', 'primary']] })
      if (!c) return
      if (c === 'skip') {  // ignore the new ones so they stop coming back, and keep all of them out of this commit
        skip = [...new Set([...risky, ...big])]
        for (const f of skip.filter(f => f.x === '?' || f.x === 'A')) await api('ignore', { repo: S.repo, pattern: f.path })
        if (everything) await api('stage', { repo: S.repo })
        const inIndex = skip.filter(f => f.x !== '?').map(f => f.path)
        if (inIndex.length) await api('unstage', { repo: S.repo, paths: inIndex })
        everything = false
      }
    }
    const rest = going.filter(f => !skip.includes(f))
    const msg = val('msg').trim() || suggestMsg(rest.length ? rest : [{ path: '.gitignore', x: 'M', y: '.' }])
    if (await act('commit', { message: msg, amend: S.amend, everything }, S.amend ? 'Amended your last commit.' : `Committed: ${msg.split('\n')[0]}`, undoMove('soft'))) {
      delete S.f.msg; S.amend = false; render()
    }
  },
  editMessage: async () => {
    const m = await ask({ title: 'Edit last commit message', input: 'Describe what you changed', value: S.st.last_message, buttons: [['Save message', true]] })
    if (m) return act('commit', { message: m, amend: true }, 'Updated the message.', undoMove('soft'))
  },
  undoCommit: async () => {
    const s = S.st, last = esc(s.last_message.split('\n')[0])
    if (pushed(s)) {  // already shared: reverse it with a new commit instead of rewriting history
      if (await confirmIt('Undo your last commit?', `“${last}” is already on ${esc(remoteHost(s))}, so KrazyGit adds a new commit that reverses it. That’s the safe way to undo shared work.`, 'Undo commit'))
        return act('revert', { sha: 'HEAD' }, 'Done. A new commit reverses it. Sync to upload it.', undoMove('keep'))
      return
    }
    if (await confirmIt('Undo your last commit?', `“${last}” is taken back. The changes stay in your files, so nothing is lost.`, 'Undo commit'))
      return act('undo_commit', {}, 'Undid the last commit. Your changes are still in your files.', undoMove('soft'))
  },
  discard: async d => {
    if (await confirmIt(`Discard changes to ${d.path}?`, `${d.new ? 'This file is new, so discarding removes it. ' : 'The file goes back to how it was in your last commit. '}A backup is kept in Stashes.`, 'Discard', 'danger-btn'))
      return act('discard', { paths: [d.path, d.orig].filter(Boolean) }, 'Discarded. A backup is in Stashes.', undoDiscard)
  },
  discardAll: async () => {
    const n = S.st.files.filter(f => !f.conflict).length
    if (await confirmIt(`Throw away all ${plural(n, 'change')}?`, 'Every file goes back to your last commit, and new files are removed. A backup is kept in Stashes, and you can press Undo straight after.', 'Discard everything', 'danger-btn'))
      return act('discard', { paths: ['.'] }, 'Discarded all changes. A backup is in Stashes.', undoDiscard)
  },
  ignore: d => act('ignore', { pattern: d.pattern }, r => `Added ${d.pattern} to .gitignore.${r?.still_tracked ? ` Git still tracks ${plural(r.still_tracked, 'file')} it already had: see the suggestion to stop.` : ''}`),
  untrack: async () => {
    const n = S.st.ignored_tracked
    if (await confirmIt(`Stop tracking ${plural(n, 'ignored file')}?`, `Git forgets ${n === 1 ? 'it' : 'them'}, and ${n === 1 ? 'it stays' : 'they stay'} on your computer. Commit to finish.
      <p>When teammates sync that commit, Git removes ${n === 1 ? 'the file' : 'those files'} from their copy too. That’s fine for generated files, but they’d need to recreate anything like settings or keys.</p>`, 'Stop tracking'))
      return act('untrack_ignored', {}, r => `Git stopped tracking ${plural(r.count, 'file')}. Commit to finish.`)
  },
  stashAll: async () => {
    const m = await ask({ title: 'Stash your changes', body: 'Your changes go on the shelf and your files go back to your last commit. Bring them back any time.', input: 'What were you working on? (optional)', buttons: [['Stash', true]] })
    if (m !== null) return act('stash_save', { message: m }, 'Stashed your changes.', () => () => act('stash_apply', { ref: 'stash@{0}', pop: true }, 'Undone. Your changes are back.'))
  },

  // branches
  newBranch: async d => {
    const s = S.st, team = !d.start && !s.detached && s.team_main  // new work usually starts from the team's newest main branch
    const dirty = s.files.some(f => !f.conflict)  // uncommitted changes always fit where you are; on the team's copy they may clash
    const r = await ask({ title: 'New branch', body: team
        ? `Start it from the team’s latest <b>${esc(shortName(team))}</b> on ${esc(serverName(s, team.split('/')[0]))}, or from <b>${esc(s.branch)}</b> as it is now. You switch to it, and uncommitted changes come along.`
        : `Starts from ${d.start ? `<code>${esc(d.start.length === 40 ? d.start.slice(0, 7) : d.start)}</code>` : s.detached ? 'this commit' : `<b>${esc(s.branch)}</b>`}. You switch to it, and uncommitted changes come along.`,
      input: 'Describe the work, e.g. fix login button', buttons: team ? [[`From ${s.branch}`, 'here', dirty ? 'primary' : ''], [`From the team’s ${shortName(team)}`, 'team', dirty ? '' : 'primary']] : [['Create branch', true]] })
    const raw = team ? r?.text : r, name = raw && named(raw, 'branch')
    if (name) return act('create_branch', { name, start: team && r.choice === 'team' ? team : d.start || null }, `Created ${name} and switched to it.`)
  },
  switch: async d => {
    const s = S.st, target = d.remote ? shortName(d.name) : d.name
    let stash = false
    if (s.files.some(f => !f.conflict) && !s.detached) {
      const c = await ask({ title: `Switch to ${target}`, body: `You have uncommitted changes on <b>${esc(s.branch)}</b>. What should happen to them?`,
        buttons: [[`Leave them on ${s.branch}`, 'stash', ''], [`Bring them to ${target}`, 'bring', 'primary']] })
      if (!c) return
      stash = c === 'stash'
    }
    const back = !s.detached && (() => () => act('switch', { name: s.branch }, `Back on ${s.branch}.`))
    return act('switch', { name: d.name, remote: !!d.remote, stash_first: stash }, `Switched to ${target}.${stash ? ` Your changes are waiting on ${s.branch}.` : ''}`, back)
  },
  merge: async d => {
    const cur = S.st.branch, p = await api('merge_preview', { repo: S.repo, name: d.name })
    if (!p.count) return toast(`${cur} already has everything from ${d.name}.`)
    const body = `Brings ${plural(p.count, 'commit')} from <b>${esc(d.name)}</b> into <b>${esc(cur)}</b>.` + (p.clashes.length
      ? `<p>These files changed on both sides, so you’ll choose what to keep:</p><ul>${p.clashes.map(f => `<li><code>${esc(f)}</code></li>`).join('')}</ul>`
      : ' No conflicts expected.')
    if (await confirmIt(`Merge ${d.name} into ${cur}?`, body, 'Merge')) return act('merge', { name: d.name }, `Merged ${d.name} into ${cur}.`, undoMove('keep'))
  },
  rebase: async d => {
    const cur = S.st.branch
    if (await confirmIt(`Rebase ${cur} onto ${d.name}?`, `Replays your commits from <b>${esc(cur)}</b> on top of the latest <b>${esc(d.name)}</b>. Tidier than a merge, but avoid it on branches other people already use.`, 'Rebase'))
      return act('rebase', { name: d.name }, `Rebased ${cur} onto ${d.name}.`, undoMove('keep'))
  },
  rename: async d => {
    const s = S.st, up = s.branches.find(b => b.name === d.name)?.upstream, main = MAIN.includes(d.name), where = up && esc(serverName(s, up.split('/')[0]))
    const r = await ask({ title: `Rename ${d.name}`, input: 'New name', value: d.name,
      body: up ? `It’s also on ${where}. Rename it there too, or only here: then the old name stays online, and the next Sync uploads the new one.${main ? `<p><b>${esc(d.name)} is a main branch.</b> Renaming it online affects everyone on the project.</p>` : ''}` : '',
      buttons: !up ? [['Rename', true]] : main ? [[`Rename on ${where} too`, 'both', ''], ['Only here', 'here', 'primary']] : [['Only here', 'here', ''], [`Rename on ${where} too`, 'both', 'primary']] })
    const raw = up ? r?.text : r, name = raw && named(raw, 'branch'), on_server = !!up && r?.choice === 'both'
    if (name && name !== d.name) return act('rename_branch', { old: d.name, new: name, on_server }, `Renamed to ${name}${on_server ? `, here and on ${where}` : ''}.`,
      () => () => act('rename_branch', { old: name, new: d.name, on_server }, 'Undone.'))
  },
  deleteBranch: async d => {
    const main = MAIN.includes(d.name) ? '<p><b>This is one of your main branches.</b> Most projects need it. Only delete it if you’re sure.</p>' : ''
    if (!await confirmIt(`Delete ${d.name}?`, `You can bring it back any time from the Recycle bin.${main}`, 'Delete branch', 'danger-btn')) return
    const r = await deleteBranch(d.name)
    if (r) toast(`Deleted ${d.name}. It’s in the Recycle bin.`, 'ok', null, undoBin('branch')(r))
    return refresh()
  },
  deleteMerged: async () => {
    const tidy = S.st.merged.filter(b => b !== S.st.branch && !MAIN.includes(b))
    if (!await confirmIt(`Delete ${plural(tidy.length, 'merged branch', 'merged branches')}?`, `Everything on them is already in <b>${esc(S.st.branch)}</b>.<ul>${tidy.map(b => `<li>${esc(b)}</li>`).join('')}</ul>They go to the Recycle bin.`, 'Delete them', 'danger-btn')) return
    const gone = await deleteMany(tidy)
    toast(`Tidied up ${plural(gone.length, 'branch', 'branches')}.`, 'ok', null, undoAll('branch', gone))
    return refresh()
  },
  branchHistory: d => { S.tab = 'history'; S.logRef = d.name; S.commit = null; return refresh() },
  bView: d => { S.bview = d.view; S.bsel.clear(); render() },
  prPreview: async d => {
    try { S.cmp = { name: d.name, base: S.st.team_main, data: await api('compare', { repo: S.repo, base: S.st.team_main, head: d.name }) } } catch (e) { return showError(e) }
    render()
  },
  cmpClose: () => { S.cmp = null; render() },
  prOpen: async d => {
    let url
    try { url = await api('pr_link', { repo: S.repo, name: d.name }) } catch (e) { return showError(e) }
    window.open(url, '_blank', 'noopener')
  },
  bToggle: (d, el) => { if (el.checked) S.bsel.add(d.name); else S.bsel.delete(d.name); render() },
  bAll: (d, el) => { const m = branchModel(S.st); if (el.checked) m.pick.forEach(b => S.bsel.add(b.name)); else S.bsel.clear(); render() },
  bPick: d => { const m = branchModel(S.st); S.bsel = new Set(m.pick.filter({ merged: m.merged, old: m.isOld, sync: m.needsSync }[d.which]).map(b => b.name)); render() },
  bClear: () => { S.bsel.clear(); render() },
  bSort: (d, el) => { S.bsort = el.value; render() },
  bulkDelete: async () => {
    const names = [...S.bsel], mains = names.filter(n => MAIN.includes(n))
    if (!await confirmIt(`Delete ${plural(names.length, 'branch', 'branches')}?`, `<ul>${names.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
      ${mains.length ? `<p><b>${esc(listJoin(mains))} ${mains.length === 1 ? 'is a main branch' : 'are main branches'}.</b> Most projects need ${mains.length === 1 ? 'it' : 'them'}.</p>` : ''}
      <p>They go to the Recycle bin, so you can bring them back.</p>`, 'Delete', 'danger-btn')) return
    const gone = await deleteMany(names)
    S.bsel.clear()
    if (gone.length) toast(`Deleted ${plural(gone.length, 'branch', 'branches')}. They’re in the Recycle bin.`, 'ok', null, undoAll('branch', gone))
    return refresh()
  },
  syncBranch: d => syncBranches([d.name]),
  bulkSync: () => { const names = [...S.bsel]; S.bsel.clear(); return syncBranches(names) },
  bulkPublish: () => { const names = [...S.bsel]; S.bsel.clear(); return act('publish_branches', { names }, `Uploaded ${plural(names.length, 'branch', 'branches')} to ${remoteHost(S.st)}.`) },
  publishOne: d => act('publish_branches', { names: [d.name] }, `Uploaded ${d.name} to ${remoteHost(S.st)}.`),
  bulkTrack: () => { const names = [...S.bsel]; S.bsel.clear(); return act('track_branches', { names }, `Made local copies of ${plural(names.length, 'branch', 'branches')}.`) },
  bulkDeleteRemote: () => deleteRemote([...S.bsel]),
  deleteRemote: d => deleteRemote([d.name]),

  // history
  logRef: (d, el) => { S.logRef = el.value; S.commit = null; S.logLimit = 100; return refresh() },
  search: (d, el) => { S.search = el.value.trim(); S.logLimit = 100; return refresh() },
  sMode: (d, el) => { S.smode = el.value; S.search = $('#search')?.value.trim() || ''; S.logLimit = 100; return refresh() },
  moreLog: () => { S.logLimit += 100; return refresh() },
  showCommit: async d => { S.commit = await api('commit_info', { repo: S.repo, sha: d.sha }); render() },
  showLost: async d => { S.commit = await api('commit_info', { repo: S.repo, sha: d.sha }); S.tab = 'history'; S.logRef = '--all'; return refresh() },
  revert: async d => {
    if (await confirmIt('Undo this commit?', 'Git adds a new commit that reverses it. Your history stays intact, so this is safe even if you already uploaded it.', 'Undo commit'))
      return act('revert', { sha: d.sha }, 'Done. A new commit reverses it.', undoMove('keep'))
  },
  cherryPick: async d => {
    if (await confirmIt(`Copy this commit to ${S.st.branch}?`, 'Its changes are applied on your branch as a new commit.', 'Copy commit'))
      return act('cherry_pick', { sha: d.sha }, `Copied to ${S.st.branch}.`, undoMove('keep'))
  },
  resetTo: async d => {
    const s = S.st, c = await ask({ title: `Go back to “${d.subject}”?`,
      body: `<b>${esc(s.detached ? 'You' : s.branch)}</b> moves back to this commit. Later commits leave the branch, but Undo history can bring them back.${s.upstream ? `<p>If those commits are already on ${esc(remoteHost(s))}, the next Sync brings them straight back. To undo shared work, use <b>Undo this commit</b> instead.</p>` : ''}`,
      buttons: [['Throw away later changes', 'hard', 'danger'], ['Keep the changes in my files', 'mixed', 'primary']] })
    if (c) return act('reset_to', { sha: d.sha, mode: c }, r => r?.backup ? 'Went back. Your uncommitted work was backed up to Stashes.' : 'Went back to that commit.', undoMove(c === 'mixed' ? 'mixed' : 'keep'))
  },
  checkoutCommit: async d => {
    const s = S.st, back = !s.detached && (() => () => act('switch', { name: s.branch }, `Back on ${s.branch}.`))
    if (await confirmIt('Look around at this commit?', 'Your files change to how they were back then, so you can test or browse. You’re off any branch until you switch back.', 'Look around'))
      return act('checkout_commit', { sha: d.sha }, 'You’re now looking at that commit. Switch to a branch to get back.', back)
  },
  restoreFile: async d => {
    if (await confirmIt(`Restore ${d.path}?`, `${d.deleted ? 'Brings back the file as it was just before this commit deleted it.' : 'Puts this commit’s version of the file in your folder.'} Unsaved edits to it are backed up to Stashes first.`, 'Restore file'))
      return act('restore_file', { sha: d.sha, path: d.path, deleted: !!d.deleted }, `Restored ${d.path}. Commit it to keep it.`)
  },
  newTag: async d => {
    const raw = await ask({ title: 'New tag', body: 'Usually a version number.', input: 'e.g. v1.0.0', buttons: [['Next', true]] })
    const name = raw && named(raw, 'tag')
    if (!name) return
    const message = await ask({ title: `What’s in ${name}?`, body: 'Optional. A line or two people see next to the tag, for example on GitHub’s releases page.', input: 'e.g. First public release', buttons: [['Create tag', true]] })
    if (message !== null) return act('create_tag', { name, sha: d.sha || null, message }, `Tagged ${name}.`)
  },
  deleteTag: async d => {
    const host = remoteHost(S.st), up = S.rtags?.includes(d.name)
    const c = await ask({ title: `Delete tag ${d.name}?`, body: up ? `It’s also on ${esc(host)}. Deleted only here, it comes back the next time you sync. Either way, a copy goes to the Recycle bin.` : 'It goes to the Recycle bin.',
      buttons: up ? [['Only on this computer', 'here', ''], [`Delete here and on ${host}`, 'both', 'danger-btn']] : [['Delete tag', 'here', 'danger-btn']] })
    if (c) return act('delete_tag', { name: d.name, on_server: c === 'both' }, `Deleted ${d.name}${c === 'both' ? ` here and on ${host}` : ''}.`, undoBin('tag'))
  },
  uploadTags: d => { const names = d.names.split('\n'); return act('upload_tags', { names }, `Uploaded ${names.length === 1 ? names[0] : plural(names.length, 'tag')} to ${remoteHost(S.st)}.`) },

  // stashes
  stashApply: d => act('stash_apply', { ref: d.ref, pop: !!d.pop }, d.pop ? 'Brought your changes back.' : 'Applied a copy. The stash is still on the shelf.'),
  stashView: async d => {
    if (S.stashView === d.ref) S.stashView = null
    else { S.stashDiff = await api('stash_diff', { repo: S.repo, ref: d.ref }); S.stashView = d.ref }
    render()
  },
  stashDrop: async d => {
    if (await confirmIt('Delete this stash?', 'It goes to the Recycle bin, so you can still get it back.', 'Delete stash', 'danger-btn')) {
      S.stashView = null
      return act('stash_drop', { ref: d.ref }, 'Deleted the stash.', undoBin('stash'))
    }
  },

  // recycle bin, undo history
  restore: async d => {
    let name = d.name
    if (d.kind === 'branch') {
      name = named(await ask({ title: 'Restore branch', body: 'Choose a name for it.', input: 'Branch name', value: d.name, buttons: [['Restore', true]] }), 'branch')
      if (!name) return
    }
    const label = d.kind === 'stash' ? 'the stash' : d.kind === 'remote' ? `${shortName(name)} on ${remoteHost(S.st)}` : name
    if (await act('restore', { kind: d.kind, sha: d.sha, name: name || '', ref: d.ref || '' }, `Restored ${label}.`)) { S.lost = null; render() }
  },
  forget: async d => {
    if (await confirmIt('Remove this forever?', 'Git will clean it up for good the next time it tidies itself. This can’t be undone.', 'Remove forever', 'danger-btn')) return act('forget', { ref: d.ref })
  },
  emptyBin: async () => {
    if (await confirmIt('Empty the recycle bin?', 'Everything in it can be cleaned up by Git for good. This can’t be undone.', 'Empty bin', 'danger-btn')) return act('forget', {}, 'Recycle bin emptied.')
  },
  lostScan: async () => { S.lost = await api('lost', { repo: S.repo }); render() },
  undoTo: async d => {
    if (await confirmIt('Go back to this moment?', `Puts things back to: <b>${esc(d.label)}</b>. Uncommitted work is backed up to Stashes first, and you can undo this too.`, 'Go back'))
      return act('reset_to', { sha: d.sha, mode: 'hard' }, r => r?.backup ? 'Went back. Your uncommitted work was backed up to Stashes.' : 'Went back.', undoMove('keep'))
  },

  // command line, settings
  runCmd: async d => {
    const cmd = (d.cmd ?? val('cmd')).trim()
    if (!cmd) return
    S.f.cmd = cmd
    try { const r = await api('raw', { repo: S.repo, command: cmd }); S.cmdOut = `$ git ${cmd.replace(/^git\s+/, '')}\n${r.out || '(no output)'}` } catch (e) { S.cmdOut = e.error }
    return refresh()
  },
  saveWho: d => {
    const email = val('whoEmail', S.st.who.email), project_only = d.scope === 'project'
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('That email doesn’t look right.', 'warn')
    return act('set_identity', { name: val('whoName', S.st.who.name), email, project_only }, project_only ? 'Saved for this project.' : 'Saved. Your commits will carry this name.')
  },
  clearWho: () => { delete S.f.whoName; delete S.f.whoEmail; return act('clear_project_identity', {}, 'This project uses your usual name and email again.') },
  addRemote: async () => {
    const url = val('remUrl').trim(), name = S.adv ? val('remName', hasRemote(S.st) ? '' : 'origin').trim() : 'origin'
    if (!/^(https?:\/\/|git@|ssh:\/\/|file:\/\/|\/|~)/.test(url)) return toast('That doesn’t look like a repository address. Copy it from GitHub: it starts with https:// or git@', 'warn')
    if (!await act('add_remote', { name, url }, `Connected to ${hostName(url)}.`)) return
    delete S.f.remName; delete S.f.remUrl
    if (S.st.has_commits && !S.st.detached) return ACT.sync()  // upload straight away: one less thing to remember
    render()
  },
  removeRemote: async d => {
    if (await confirmIt(`Disconnect from ${d.name}?`, 'Only the link is removed. Nothing on the server is deleted, and you can connect again any time.', 'Disconnect'))
      return act('remove_remote', { name: d.name }, 'Disconnected.')
  },

  // conflicts
  finish: async d => {
    if (d.action === 'abort' && !await confirmIt('Cancel and go back?', 'Everything goes back to exactly how it was before you started. Choices you made here are dropped.', 'Cancel it', 'danger-btn')) return
    return act('finish', { kind: d.kind, action: d.action }, { continue: 'Done. The result is saved.', abort: 'Cancelled. Everything is back how it was.', skip: 'Skipped that commit.' }[d.action],
      d.kind === 'merge' && d.action === 'continue' ? undoMove('keep') : null)
  },
  pickConflict: async d => { S.cfPath = d.path; await loadTab().catch(showError); render() },
  takeSide: async d => {
    const [mine, theirs] = sides(S.st)
    if (await confirmIt(`Use ${(d.side === 'ours' ? mine : theirs).toLowerCase()} for ${d.path}?`, `The other side’s changes to this file are dropped.`, 'Use it'))
      return act('take', { path: d.path, side: d.side }, `Fixed ${d.path}.`)
  },
  cfPick: d => {
    decide(S.cf, S.cf.segs[d.i], d.pick)
    render()
  },
  cfUndo: d => { delete S.cf.segs[d.i].res; render() },
  cfApplyAll: () => { applySafe(S.cf); render() },
  cfFixFile: () => { applySafe(S.cf); return ACT.saveConflict() },
  fixAllEasy: async () => {
    const files = S.st.files.filter(f => f.conflict && f.x !== 'D' && f.y !== 'D'), ready = []
    for (const f of files) {
      const cf = await loadConflict(f)
      if (cf.segs && applySafe(cf)) ready.push({ path: f.path, text: composed(cf, false) })
    }
    if (!ready.length) return toast('Each remaining file has at least one clash that needs your decision.', 'warn')
    if (!await confirmIt(`Fix ${plural(ready.length, 'file')} automatically?`, `<ul>${ready.map(r => `<li><code>${esc(r.path)}</code></li>`).join('')}</ul>
      <p>In these files every clash has a choice that loses nothing: one side already has everything, or each side only added lines. Until you finish, “Cancel and go back” still undoes the whole merge.</p>`, 'Fix them')) return
    for (const r of ready) await api('save_file', { repo: S.repo, path: r.path, text: r.text })
    toast(`Fixed ${plural(ready.length, 'file')}.${files.length > ready.length ? ` ${plural(files.length - ready.length, 'file')} still need${files.length - ready.length === 1 ? 's' : ''} you.` : ''}`)
    S.cf = null
    return refresh()
  },
  howToChoose: () => ask({ title: 'How do I choose?', body: HOW_TO_CHOOSE, buttons: [['Got it', true]] }),
  cfEdit: d => { const x = S.cf.segs[d.i]; x.draft = x.res ?? joinLines(x.ours, x.theirs, eolOf(S.cf)); x.editing = true; render(); $('#cfe' + d.i)?.focus() },
  cfDone: d => {
    const x = S.cf.segs[d.i], eol = eolOf(S.cf)
    let v = x.draft.replace(/\r?\n/g, eol)
    if (v && !v.endsWith('\n') && (x.ours + x.theirs).endsWith('\n')) v += eol
    Object.assign(x, { res: v, choice: 'Edited by hand', editing: false })
    render()
  },
  saveConflict: () => S.cf.segs.some(x => x.text === undefined && (x.res === undefined || x.editing))  // never save with a clash undecided
    ? toast('Decide every clash first.', 'warn') : act('save_file', { path: S.cf.path, text: composed(S.cf, false) }, `Fixed ${S.cf.path}.`),
  manualConflict: () => { S.cf.manual = composed(S.cf, true); render() },
  cfBack: () => { delete S.cf.manual; render() },
  saveManual: async () => {
    const text = (S.cf.manual ?? S.cf.raw).replace(/\r?\n/g, eolOf(S.cf))
    if (MARK.test(text) && !await confirmIt('Conflict markers are still in the file', 'Lines starting with <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code> or <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code> are still there. Save anyway?', 'Save anyway')) return
    return act('save_file', { path: S.cf.path, text }, `Fixed ${S.cf.path}.`)
  },
  markResolved: d => act('mark_resolved', { path: d.path }, `Marked ${d.path} as fixed.`),
  reloadConflict: () => { S.cf = null; return refresh() },
}

// ---------- wiring ----------
// One action at a time: a double-click or an impatient second click can't run something twice.
// Looking around (tabs, picking a file, ticking branches, conflict choices) is always allowed.
let acting = false
const FREE = new Set(['noop', 'diffMode', 'hideTip', 'keepRemote', 'bRemote', 'cfApplyAll', 'howToChoose', 'tab', 'tips', 'select', 'showCommit', 'pickConflict', 'cfPick', 'cfUndo', 'cfEdit', 'cfDone', 'cfBack', 'manualConflict',
  'useSuggestion', 'amendToggle', 'logRef', 'search', 'moreLog', 'stashView', 'toggleAdv', 'refresh', 'branchHistory', 'openRepo',
  'bView', 'bToggle', 'bAll', 'bPick', 'bClear', 'bSort', 'guide', 'guideClose', 'guideTab', 'sMode', 'cmpClose'])
async function guarded(fn) {
  if (acting) return
  acting = true
  try { await fn() } catch (e) { showError(e) } finally { acting = false }
}
const run = (name, el) => FREE.has(name) ? Promise.resolve().then(() => ACT[name](el.dataset, el)).catch(showError) : guarded(() => ACT[name](el.dataset, el))
const closePops = except => document.querySelectorAll('details.pop[open]').forEach(p => { if (p !== except) p.open = false })
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'), pop = e.target.closest('details.pop')
  closePops(el ? null : pop)  // clicking an item in a menu closes it; clicking inside one (like its search box) keeps it open
  if (el?.tagName === 'A') e.preventDefault()  // links in the guide that lead somewhere in the app
  if (el && !el.disabled) run(el.dataset.act, el)
})
document.addEventListener('change', e => { if (e.target.dataset.change) run(e.target.dataset.change, e.target) })
document.addEventListener('input', e => {
  const t = e.target
  if (t.id === 'repoFilter') { S.filter = t.value; renderRepoList() }
  else if (t.id === 'bpq') $('#bplist').innerHTML = pickerList(S.st, t.value)
  else if (t.id === 'bq') { S.bq = t.value; render() }
  else if (t.id === 'gq') { S.gq = t.value; render() }
  else if (t.id === 'cfm') S.cf.manual = t.value
  else if (t.dataset.cf) S.cf.segs[t.dataset.cf].draft = t.value
  else if (t.id && main.contains(t)) S.f[t.id] = t.value
})
document.addEventListener('toggle', e => { if (e.target.matches?.('details.pop[open]')) e.target.querySelector('input[type=search]')?.focus() }, true)
document.addEventListener('keydown', e => {
  const t = e.target
  if (e.key === 'Escape' && document.querySelector('details.pop[open]')) closePops()
  else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && t.id === 'msg') { e.preventDefault(); run('commit', t) }
  else if (e.key === 'Enter' && t.dataset.enter) { e.preventDefault(); run(t.dataset.enter, t) }
  else if (e.key === 'Enter' && t.id === 'bpq') { e.preventDefault(); $('#bplist [data-act="switch"]')?.click() }
})
// Background refresh: notice edits made in your code editor, and Git commands run elsewhere, without anyone pressing anything.
// ponytail: polls every 10 seconds while the window is visible; file-system events would be quicker if big projects need it.
const quietMoment = () => !S.closed && S.repo && !acting && !busyN && !dlg.open && !document.querySelector('details.pop[open]')
window.addEventListener('focus', () => { if (quietMoment()) refresh(true) })
setInterval(() => { if (!document.hidden && quietMoment()) refresh(true) }, 10000)
setInterval(() => { if (!S.closed) api('ping', {}, true).catch(() => {}) }, 30000) // tells KrazyGit this window is still open
document.querySelectorAll('[data-ic]').forEach(el => el.insertAdjacentHTML('afterbegin', ic(el.dataset.ic)))

;(async () => {
  try { S.repos = await api('repos') } catch (e) { showError(e) }
  const last = store('repo')
  S.repo = S.repos.some(r => r.path === last) ? last : S.repos[0]?.path || null
  refresh()
})()
</script>
